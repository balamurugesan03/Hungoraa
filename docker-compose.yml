version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: dinesmart-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-secret}
      MONGO_INITDB_DATABASE: dinesmart
    volumes:
      - mongo_data:/data/db
    networks:
      - dinesmart-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dinesmart-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # NOTE: var name must match what src/config/database.js reads (MONGO_URI),
      # and must override .env's localhost value with the in-network mongo host.
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-secret}@mongodb:27017/dinesmart?authSource=admin
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - dinesmart-net
    volumes:
      - ./backend/logs:/app/logs

  owner:
    build:
      context: ./owner
      dockerfile: Dockerfile
    container_name: dinesmart-owner
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - dinesmart-net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: dinesmart-admin
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - dinesmart-net

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: dinesmart-landing
    restart: unless-stopped
    ports:
      - "3003:80"
    networks:
      - dinesmart-net

  nginx:
    image: nginx:alpine
    container_name: dinesmart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - owner
      - admin
      - landing
    networks:
      - dinesmart-net

volumes:
  mongo_data:

networks:
  dinesmart-net:
    driver: bridge
