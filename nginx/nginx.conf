user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    client_max_body_size 10M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Landing page (marketing site)
    upstream landing_site {
        server landing:80;
    }

    # Backend API
    upstream backend_api {
        server backend:5000;
        keepalive 32;
    }

    # Owner Panel
    upstream owner_panel {
        server owner:80;
    }

    # Admin Panel
    upstream admin_panel {
        server admin:80;
    }

    server {
        listen 80;
        server_name hungora.com www.hungora.com;

        # Certbot ACME HTTP-01 challenge — needed to issue/renew the cert below.
        #   certbot certonly --webroot -w ./nginx/certbot-webroot -d hungora.com -d www.hungora.com
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Once the cert exists and the HTTPS server block below is enabled,
        # switch this to `return 301 https://$host$request_uri;` so HTTP just
        # redirects. Left serving the app directly for now so the site stays
        # reachable on first deploy, before SSL is provisioned.
        # return 301 https://$host$request_uri;

        # Landing page — https://hungora.com/
        location / {
            proxy_pass http://landing_site;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API — https://hungora.com/api/
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Auth endpoints (extra rate limiting) — https://hungora.com/api/auth/
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Uploaded images (local-disk uploads, see backend/src/config/upload.js)
        # — https://hungora.com/uploads/
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Owner Panel — https://hungora.com/owner/
        location /owner/ {
            proxy_pass http://owner_panel/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin Panel — https://hungora.com/admin-panel/
        location /admin-panel/ {
            proxy_pass http://admin_panel/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            proxy_pass http://backend_api/health;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    # Enable once real certs are on disk at ./nginx/ssl/hungora.com.{crt,key}
    # (e.g. via certbot, see the ACME location above), then also flip the HTTP
    # server above to `return 301 https://...`.
